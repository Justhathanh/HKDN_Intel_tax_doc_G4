openapi: 3.1.0
info:
  title: THTax Intelligent Tax Document Ingestion
  version: 0.2.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /clients:
    post:
      summary: Create Client
      operationId: create_client_clients_post
      parameters:
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /batches:
    post:
      summary: Create Batch
      operationId: create_batch_batches_post
      parameters:
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /batches/{batch_id}/documents:
    post:
      summary: Upload Document
      operationId: upload_document_batches__batch_id__documents_post
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bắt buộc; UUID sinh cho mỗi lần chọn file
          title: Idempotency-Key
        description: Bắt buộc; UUID sinh cho mỗi lần chọn file
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_batches__batch_id__documents_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentReceipt'
        '200':
          description: File đã có; trả Document ID cũ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentReceipt'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Idempotency-Key đã dùng cho file khác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: File quá lớn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Định dạng không được hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: File không xử lý được
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /documents/{document_id}:
    get:
      summary: Get Document
      operationId: get_document_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /batches/{batch_id}/manifest:
    get:
      summary: Manifest
      operationId: manifest_batches__batch_id__manifest_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BatchIn:
      properties:
        client_id:
          type: string
          title: Client Id
        engagement_id:
          type: string
          title: Engagement Id
      type: object
      required:
      - client_id
      - engagement_id
      title: BatchIn
    BatchOut:
      properties:
        id:
          type: string
          title: Id
        client_id:
          type: string
          title: Client Id
        engagement_id:
          type: string
          title: Engagement Id
      type: object
      required:
      - id
      - client_id
      - engagement_id
      title: BatchOut
    Body_upload_document_batches__batch_id__documents_post:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
          description: Một file PDF, JPG, PNG hoặc XML, tối đa 20 MiB
      type: object
      title: Body_upload_document_batches__batch_id__documents_post
    ClientIn:
      properties:
        name:
          type: string
          title: Name
        tax_id:
          type: string
          title: Tax Id
      type: object
      required:
      - name
      - tax_id
      title: ClientIn
    ClientOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        tax_id:
          type: string
          title: Tax Id
      type: object
      required:
      - id
      - name
      - tax_id
      title: ClientOut
    DocumentOut:
      properties:
        document_id:
          type: string
          title: Document Id
        batch_id:
          type: string
          title: Batch Id
        file_name:
          type: string
          title: File Name
        size:
          type: integer
          title: Size
        sha256:
          type: string
          title: Sha256
        mime_type:
          type: string
          title: Mime Type
        page_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Count
        status:
          type: string
          title: Status
        uploaded_by:
          type: string
          title: Uploaded By
        received_at:
          type: string
          title: Received At
      type: object
      required:
      - document_id
      - batch_id
      - file_name
      - size
      - sha256
      - mime_type
      - page_count
      - status
      - uploaded_by
      - received_at
      title: DocumentOut
    DocumentReceipt:
      properties:
        document_id:
          type: string
          title: Document Id
        submission_id:
          type: string
          title: Submission Id
        batch_id:
          type: string
          title: Batch Id
        file_name:
          type: string
          title: File Name
        size:
          type: integer
          title: Size
        sha256:
          type: string
          title: Sha256
        mime_type:
          type: string
          title: Mime Type
        page_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Count
        channel:
          type: string
          title: Channel
        uploaded_by:
          type: string
          title: Uploaded By
        status:
          type: string
          title: Status
        duplicate:
          type: boolean
          title: Duplicate
        received_at:
          type: string
          title: Received At
      type: object
      required:
      - document_id
      - submission_id
      - batch_id
      - file_name
      - size
      - sha256
      - mime_type
      - page_count
      - channel
      - uploaded_by
      - status
      - duplicate
      - received_at
      title: DocumentReceipt
    ErrorBody:
      properties:
        error_code:
          type: string
          title: Error Code
        message:
          type: string
          title: Message
        submission_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Submission Id
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
      type: object
      required:
      - error_code
      - message
      title: ErrorBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Manifest:
      properties:
        batch_id:
          type: string
          title: Batch Id
        submissions:
          type: integer
          title: Submissions
        by_outcome:
          additionalProperties:
            type: integer
          type: object
          title: By Outcome
        items:
          items:
            $ref: '#/components/schemas/ManifestItem'
          type: array
          title: Items
      type: object
      required:
      - batch_id
      - submissions
      - by_outcome
      - items
      title: Manifest
    ManifestItem:
      properties:
        submission_id:
          type: string
          title: Submission Id
        file_name:
          type: string
          title: File Name
        size:
          type: integer
          title: Size
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        outcome:
          type: string
          title: Outcome
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        uploaded_by:
          type: string
          title: Uploaded By
        received_at:
          type: string
          title: Received At
      type: object
      required:
      - submission_id
      - file_name
      - size
      - sha256
      - outcome
      - reason
      - document_id
      - status
      - uploaded_by
      - received_at
      title: ManifestItem
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
