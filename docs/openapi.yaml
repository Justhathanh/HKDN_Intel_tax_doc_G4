openapi: 3.1.0
info:
  title: THTax Intelligent Tax Document Ingestion
  version: 0.2.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /retry-policy:
    get:
      summary: Get Retry Policy
      operationId: get_retry_policy_retry_policy_get
      parameters:
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryPolicyOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clients:
    post:
      summary: Create Client
      operationId: create_client_clients_post
      parameters:
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /batches:
    post:
      summary: Create Batch
      operationId: create_batch_batches_post
      parameters:
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /batches/{batch_id}/documents:
    post:
      summary: Upload Document
      operationId: upload_document_batches__batch_id__documents_post
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bắt buộc; UUID sinh cho mỗi lần chọn file
          title: Idempotency-Key
        description: Bắt buộc; UUID sinh cho mỗi lần chọn file
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_batches__batch_id__documents_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentReceipt'
        '200':
          description: File đã có; trả Document ID cũ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentReceipt'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Xung đột trạng thái hoặc Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: File quá lớn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Định dạng không được hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: File không xử lý được
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /documents/{document_id}:
    get:
      summary: Get Document
      operationId: get_document_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents/{document_id}/jobs:
    get:
      summary: Get Document Jobs
      operationId: get_document_jobs_documents__document_id__jobs_get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: job_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Type
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHistoryOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/dead-letter:
    get:
      summary: List Dead Letter
      operationId: list_dead_letter_jobs_dead_letter_get
      parameters:
      - name: unresolved_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Unresolved Only
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterListOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    get:
      summary: Get Job
      operationId: get_job_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/retry:
    post:
      summary: Retry Job
      operationId: retry_job_jobs__job_id__retry_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '200':
          description: Job đang chờ hoặc đang chạy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Xung đột trạng thái hoặc Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: File không xử lý được
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /batches/{batch_id}/manifest:
    get:
      summary: Manifest
      operationId: manifest_batches__batch_id__manifest_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: x-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User
      - name: x-client-ids
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Client-Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Không tìm thấy hoặc không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BatchIn:
      properties:
        client_id:
          type: string
          title: Client Id
        engagement_id:
          type: string
          title: Engagement Id
      type: object
      required:
      - client_id
      - engagement_id
      title: BatchIn
    BatchOut:
      properties:
        id:
          type: string
          title: Id
        client_id:
          type: string
          title: Client Id
        engagement_id:
          type: string
          title: Engagement Id
      type: object
      required:
      - id
      - client_id
      - engagement_id
      title: BatchOut
    Body_upload_document_batches__batch_id__documents_post:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
          description: Một file PDF, JPG, PNG hoặc XML, tối đa 20 MiB
      type: object
      title: Body_upload_document_batches__batch_id__documents_post
    ClientIn:
      properties:
        name:
          type: string
          title: Name
        tax_id:
          type: string
          title: Tax Id
      type: object
      required:
      - name
      - tax_id
      title: ClientIn
    ClientOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        tax_id:
          type: string
          title: Tax Id
      type: object
      required:
      - id
      - name
      - tax_id
      title: ClientOut
    DeadLetterListOut:
      properties:
        total:
          type: integer
          title: Total
        items:
          items:
            $ref: '#/components/schemas/JobOut'
          type: array
          title: Items
      type: object
      required:
      - total
      - items
      title: DeadLetterListOut
    DocumentOut:
      properties:
        document_id:
          type: string
          title: Document Id
        batch_id:
          type: string
          title: Batch Id
        file_name:
          type: string
          title: File Name
        size:
          type: integer
          title: Size
        sha256:
          type: string
          title: Sha256
        mime_type:
          type: string
          title: Mime Type
        page_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Count
        status:
          type: string
          title: Status
        uploaded_by:
          type: string
          title: Uploaded By
        received_at:
          type: string
          title: Received At
      type: object
      required:
      - document_id
      - batch_id
      - file_name
      - size
      - sha256
      - mime_type
      - page_count
      - status
      - uploaded_by
      - received_at
      title: DocumentOut
    DocumentReceipt:
      properties:
        document_id:
          type: string
          title: Document Id
        submission_id:
          type: string
          title: Submission Id
        batch_id:
          type: string
          title: Batch Id
        file_name:
          type: string
          title: File Name
        size:
          type: integer
          title: Size
        sha256:
          type: string
          title: Sha256
        mime_type:
          type: string
          title: Mime Type
        page_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Count
        channel:
          type: string
          title: Channel
        uploaded_by:
          type: string
          title: Uploaded By
        status:
          type: string
          title: Status
        duplicate:
          type: boolean
          title: Duplicate
        received_at:
          type: string
          title: Received At
      type: object
      required:
      - document_id
      - submission_id
      - batch_id
      - file_name
      - size
      - sha256
      - mime_type
      - page_count
      - channel
      - uploaded_by
      - status
      - duplicate
      - received_at
      title: DocumentReceipt
    ErrorBody:
      properties:
        error_code:
          type: string
          title: Error Code
        message:
          type: string
          title: Message
        submission_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Submission Id
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
      type: object
      required:
      - error_code
      - message
      title: ErrorBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobHistoryOut:
      properties:
        document_id:
          type: string
          title: Document Id
        total_attempts:
          type: integer
          title: Total Attempts
        current_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Status
        items:
          items:
            $ref: '#/components/schemas/JobOut'
          type: array
          title: Items
      type: object
      required:
      - document_id
      - total_attempts
      - current_status
      - items
      title: JobHistoryOut
    JobOut:
      properties:
        job_id:
          type: string
          title: Job Id
        client_id:
          type: string
          title: Client Id
        document_id:
          type: string
          title: Document Id
        job_type:
          type: string
          title: Job Type
        status:
          type: string
          title: Status
        attempt_no:
          type: integer
          title: Attempt No
        max_attempts:
          type: integer
          title: Max Attempts
        retry_of_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Retry Of Job Id
        correlation_id:
          type: string
          title: Correlation Id
        input_sha256:
          type: string
          title: Input Sha256
        processor_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Processor Version
        created_at:
          type: string
          title: Created At
        next_attempt_at:
          type: string
          title: Next Attempt At
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        error_retryable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Error Retryable
      type: object
      required:
      - job_id
      - client_id
      - document_id
      - job_type
      - status
      - attempt_no
      - max_attempts
      - retry_of_job_id
      - correlation_id
      - input_sha256
      - processor_version
      - created_at
      - next_attempt_at
      - started_at
      - finished_at
      - duration_ms
      - error_code
      - error_message
      - error_retryable
      title: JobOut
    Manifest:
      properties:
        batch_id:
          type: string
          title: Batch Id
        submissions:
          type: integer
          title: Submissions
        by_outcome:
          additionalProperties:
            type: integer
          type: object
          title: By Outcome
        items:
          items:
            $ref: '#/components/schemas/ManifestItem'
          type: array
          title: Items
      type: object
      required:
      - batch_id
      - submissions
      - by_outcome
      - items
      title: Manifest
    ManifestItem:
      properties:
        submission_id:
          type: string
          title: Submission Id
        file_name:
          type: string
          title: File Name
        size:
          type: integer
          title: Size
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        outcome:
          type: string
          title: Outcome
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        uploaded_by:
          type: string
          title: Uploaded By
        received_at:
          type: string
          title: Received At
      type: object
      required:
      - submission_id
      - file_name
      - size
      - sha256
      - outcome
      - reason
      - document_id
      - status
      - uploaded_by
      - received_at
      title: ManifestItem
    RetryPolicyOut:
      properties:
        default_max_attempts:
          type: integer
          title: Default Max Attempts
        backoff_base_seconds:
          type: integer
          title: Backoff Base Seconds
        backoff_max_seconds:
          type: integer
          title: Backoff Max Seconds
        default_lease_seconds:
          type: integer
          title: Default Lease Seconds
        retryable_errors:
          items:
            type: string
          type: array
          title: Retryable Errors
        non_retryable_errors:
          items:
            type: string
          type: array
          title: Non Retryable Errors
      type: object
      required:
      - default_max_attempts
      - backoff_base_seconds
      - backoff_max_seconds
      - default_lease_seconds
      - retryable_errors
      - non_retryable_errors
      title: RetryPolicyOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
